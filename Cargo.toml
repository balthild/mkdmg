[package]
name = "mkdmg"
version = "0.1.0"
description = "Create Apple Disk Image without relying on Finder GUI"
license = "GPL-3.0-only"
documentation = "https://docs.rs/mkdmg"
repository = "https://github.com/balthild/mkdmg"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
plist = { version = "1.10.3", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
xattr = "1.7.0"
