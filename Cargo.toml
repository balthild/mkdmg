[package]
name = "mkdmg"
version = "0.1.1"
description = "Create Apple Disk Image without relying on Finder GUI"
license = "GPL-3.0-only"
documentation = "https://docs.rs/mkdmg"
repository = "https://github.com/balthild/mkdmg"
edition = "2024"

[features]
default = []
cli = ["dep:clap"]

[[bin]]
name = "mkdmg"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
plist = { version = "1.10.3", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
xattr = "1.7.0"

[dependencies.clap]
version = "4.6.7"
features = ["derive", "wrap_help"]
optional = true

[package.metadata.release]
pre-release-commit-message = "chore: release {{crate_name}} version {{version}}"
tag-message = "chore: release {{crate_name}} version {{version}}"
